name: Genera e Pubblica Notizie

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clona Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Script di Generazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python genera_articoli.py

      - name: Esegui Commit e Push delle Modifiche
        run: |
          git config --global user.name "Zampamania Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto-generazione nuovo articolo pet" && git pull --rebase origin main && git push)
