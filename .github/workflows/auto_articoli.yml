name: Genera e Pubblica Articoli

on:
  schedule:
    - cron: '0 7 * * *'   # Mattina (07:00 UTC / 09:00 ora italiana)
    - cron: '0 15 * * *'  # Pomeriggio (15:00 UTC / 17:00 ora italiana)
  workflow_dispatch:      # Consente anche l'avvio manuale dalla scheda Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run article generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python genera_articoli.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html articoli/
          git diff --staged --quiet || (git commit -m "Nuovo articolo automatico (Zampamania Bot)" && git push)
